<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Work orders and swarms: CVE remediation"><title>Work orders and swarms: CVE remediation</title><defs><marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0972d3"/></marker><marker id="arrow-client-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0972d3"/></marker><marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec7211"/></marker><marker id="arrow-api-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ec7211"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8102"/></marker><marker id="arrow-data-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1d8102"/></marker><marker id="arrow-aws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d3cff"/></marker><marker id="arrow-aws-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7d3cff"/></marker><marker id="arrow-k8s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#326ce5"/></marker><marker id="arrow-k8s-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#326ce5"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="arrow-neutral-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="arrow-danger-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d13212"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="arrow-dark-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#232f3e"/></marker></defs><rect width="1400" height="720" fill="#ffffff"/><rect x="0" y="0" width="1400" height="6" fill="#ff9900"/><text x="32" y="44" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#16191f">Work orders and swarms: CVE remediation</text><text x="32" y="68" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6b7a">Security files one work order. AFS builds a budget-capped swarm, tracks every repository to merge, notifies owners and tears the team down.</text><g><rect x="860" y="96" width="510" height="380" rx="14" fill="#edf2fe" fill-opacity="0.55" stroke="#326ce5" stroke-width="1.4" stroke-dasharray="6 5"/><text x="876" y="120" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#326ce5" letter-spacing="0.6">EPHEMERAL TEAM AFS-T-CVE-2026-1234</text><text x="876" y="137" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a">teardown at work complete · hard budget cap · expiry</text></g><polyline points="250,171 275,171 275,179.5 300,179.5" fill="none" stroke="#d13212" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-danger)" /><rect x="205.75" y="101.5" width="138.5" height="21" rx="4" fill="#ffffff" stroke="#d13212" stroke-opacity="0.35"/><text x="275" y="116.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">POST /v1/work-orders</text><polyline points="540,179.5 565,179.5 565,171 590,171" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="810,171 835,175 835,200 885,201" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="1025,201 1045,201" fill="none" stroke="#326ce5" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-k8s)" /><polyline points="1185,201 1205,201" fill="none" stroke="#326ce5" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-k8s)" /><polyline points="1115,242 1115,285" fill="none" stroke="#7d3cff" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-aws)" /><rect x="1083.7" y="253" width="62.6" height="21" rx="4" fill="#ffffff" stroke="#7d3cff" stroke-opacity="0.35"/><text x="1115" y="268" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">hand off</text><polyline points="1115,350 1115,385" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><rect x="1074.2125" y="357" width="81.575" height="21" rx="4" fill="#ffffff" stroke="#ec7211" stroke-opacity="0.35"/><text x="1115" y="372" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">model calls</text><polyline points="931,450 931,505 980,505 980,560" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-neutral)" /><rect x="948.7" y="519.5" width="62.6" height="21" rx="4" fill="#ffffff" stroke="#5f6b7a" stroke-opacity="0.35"/><text x="980" y="534.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">open PRs</text><polyline points="860,601 810,601" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="560,601 510,601" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="468,229 468,394.5 610,394.5 610,560" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-api)" /><rect x="426.05" y="349.5" width="87.9" height="21" rx="4" fill="#ffffff" stroke="#ec7211" stroke-opacity="0.35"/><text x="470" y="364.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">SLA tracking</text><polyline points="260,601 140,601 140,499" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><g><rect x="30" y="130" width="220" height="82" rx="10" fill="#fdeeec" stroke="#d13212" stroke-width="1.6"/><rect x="30" y="130" width="5" height="82" rx="2" fill="#d13212" opacity="0.9"/><text x="140" y="159" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6b1104">Security team</text><text x="140" y="178" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">security_operator role</text><text x="140" y="195" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">or EventBridge event</text></g><g><rect x="300" y="130" width="240" height="99" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="300" y="130" width="5" height="99" rx="2" fill="#ec7211" opacity="0.9"/><text x="420" y="159" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">Work order</text><text x="420" y="178" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">CVE-2026-1234, due in 14 days</text><text x="420" y="195" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">affected repos, swarm template</text><text x="420" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">lifetime budget $2,000</text></g><g><rect x="590" y="130" width="220" height="82" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="590" y="130" width="5" height="82" rx="2" fill="#ec7211" opacity="0.9"/><text x="700" y="159" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-reconciler</text><text x="700" y="178" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">instantiates the team</text><text x="700" y="195" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">from the swarm template</text></g><g><rect x="885" y="160" width="140" height="82" rx="10" fill="#edf2fe" stroke="#326ce5" stroke-width="1.6"/><rect x="885" y="160" width="5" height="82" rx="2" fill="#326ce5" opacity="0.9"/><text x="955" y="189" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#102a6b">Stage 1</text><text x="955" y="208" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">triage pool</text><text x="955" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">4 workers</text></g><g><rect x="1045" y="160" width="140" height="82" rx="10" fill="#edf2fe" stroke="#326ce5" stroke-width="1.6"/><rect x="1045" y="160" width="5" height="82" rx="2" fill="#326ce5" opacity="0.9"/><text x="1115" y="189" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#102a6b">Stage 2</text><text x="1115" y="208" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">fix pool</text><text x="1115" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">20 workers</text></g><g><rect x="1205" y="160" width="140" height="82" rx="10" fill="#edf2fe" stroke="#326ce5" stroke-width="1.6"/><rect x="1205" y="160" width="5" height="82" rx="2" fill="#326ce5" opacity="0.9"/><text x="1275" y="189" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#102a6b">Stage 3</text><text x="1275" y="208" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">review pool</text><text x="1275" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">6 workers</text></g><g><rect x="885" y="285" width="460" height="65" rx="10" fill="#f6f0ff" stroke="#7d3cff" stroke-width="1.6"/><rect x="885" y="285" width="5" height="65" rx="2" fill="#7d3cff" opacity="0.9"/><text x="1115" y="314" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3b1580">Per-pool SQS inboxes for handoffs</text><text x="1115" y="333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">one identity per pool, scratch volume per worker</text></g><g><rect x="885" y="385" width="460" height="65" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="885" y="385" width="5" height="65" rx="2" fill="#ec7211" opacity="0.9"/><text x="1115" y="414" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-gateway</text><text x="1115" y="433" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">every model call counts against the lifetime budget</text></g><g><rect x="860" y="560" width="240" height="82" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="860" y="560" width="5" height="82" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="980" y="589" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">GitHub</text><text x="980" y="608" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">one PR per affected repo</text><text x="980" y="625" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">state polled via GitHub App</text></g><g><rect x="560" y="560" width="250" height="82" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="560" y="560" width="5" height="82" rx="2" fill="#ec7211" opacity="0.9"/><text x="685" y="589" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">Progress per repository</text><text x="685" y="608" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">PATCH …/repos/{host}/{owner}/{repo}</text><text x="685" y="625" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">workload token, own team only</text></g><g><rect x="260" y="560" width="250" height="82" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="260" y="560" width="5" height="82" rx="2" fill="#0972d3" opacity="0.9"/><text x="385" y="589" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Owning teams notified</text><text x="385" y="608" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">their channels or email</text><text x="385" y="625" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">pr_opened, sla_warning, merged</text></g><g><rect x="30" y="400" width="220" height="99" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="30" y="400" width="5" height="99" rx="2" fill="#1d8102" opacity="0.9"/><text x="140" y="429" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">Done → teardown</text><text x="140" y="448" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">all merged, not affected</text><text x="140" y="465" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">or skipped: team deleted,</text><text x="140" y="482" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">usage and audit kept</text></g><text x="30" y="690" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">Phase 2 of the product; built and shipped in this release. Long-running development teams use the same isolation, identity, secrets and budget controls.</text><text x="1376" y="706" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8d99a8">Enterprise Agent Factory Service · work-orders-swarm</text></svg>
