<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Identity and access"><title>Identity and access</title><defs><marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0972d3"/></marker><marker id="arrow-client-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0972d3"/></marker><marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec7211"/></marker><marker id="arrow-api-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ec7211"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8102"/></marker><marker id="arrow-data-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1d8102"/></marker><marker id="arrow-aws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d3cff"/></marker><marker id="arrow-aws-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7d3cff"/></marker><marker id="arrow-k8s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#326ce5"/></marker><marker id="arrow-k8s-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#326ce5"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="arrow-neutral-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="arrow-danger-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d13212"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="arrow-dark-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#232f3e"/></marker></defs><rect width="1400" height="700" fill="#ffffff"/><rect x="0" y="0" width="1400" height="6" fill="#ff9900"/><text x="32" y="44" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#16191f">Identity and access</text><text x="32" y="68" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6b7a">People sign in through the enterprise IdP and get a role per team. Agents get a Kubernetes identity and an IAM role, never a person's.</text><g><rect x="30" y="100" width="640" height="560" rx="14" fill="#f1f7fe" fill-opacity="0.55" stroke="#0972d3" stroke-width="1.4" stroke-dasharray="6 5"/><text x="46" y="124" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0972d3" letter-spacing="0.6">PEOPLE AND AUTOMATION</text></g><g><rect x="710" y="100" width="660" height="560" rx="14" fill="#edf2fe" fill-opacity="0.55" stroke="#326ce5" stroke-width="1.4" stroke-dasharray="6 5"/><text x="726" y="124" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#326ce5" letter-spacing="0.6">AGENTS</text></g><polyline points="190,232 190,260" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><rect x="171.35" y="235.5" width="37.3" height="21" rx="4" fill="#ffffff" stroke="#0972d3" stroke-opacity="0.35"/><text x="190" y="250.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">OIDC</text><polyline points="325,309.5 375,309.5" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><rect x="325.025" y="299" width="49.95" height="21" rx="4" fill="#ffffff" stroke="#0972d3" stroke-opacity="0.35"/><text x="350" y="314" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">Bearer</text><polyline points="875,215 875,260" fill="none" stroke="#326ce5" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-k8s)" /><polyline points="875,342 875,380" fill="none" stroke="#7d3cff" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-aws)" /><rect x="834.2125" y="350.5" width="81.575" height="21" rx="4" fill="#ffffff" stroke="#7d3cff" stroke-opacity="0.35"/><text x="875" y="365.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">team_shared</text><polyline points="1015,301 1205,301 1205,380" fill="none" stroke="#7d3cff" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-aws)" /><rect x="1075.5375" y="290.5" width="68.92500000000001" height="21" rx="4" fill="#ffffff" stroke="#7d3cff" stroke-opacity="0.35"/><text x="1110" y="305.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">dedicated</text><polyline points="1205,462 1205,520" fill="none" stroke="#7d3cff" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-aws)" /><rect x="1154.725" y="480.5" width="100.55000000000001" height="21" rx="4" fill="#ffffff" stroke="#7d3cff" stroke-opacity="0.35"/><text x="1205" y="495.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">sts:AssumeRole</text><polyline points="1015,182.5 1057.5,182.5 1057.5,191 1100,191" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><rect x="1016.2125" y="129.5" width="81.575" height="21" rx="4" fill="#ffffff" stroke="#ec7211" stroke-opacity="0.35"/><text x="1057" y="144.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">model calls</text><g><rect x="55" y="150" width="270" height="82" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="55" y="150" width="5" height="82" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="190" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">Okta or Entra ID</text><text x="190" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">service admins enable providers</text><text x="190" y="215" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">each team picks one</text></g><g><rect x="55" y="260" width="270" height="99" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="55" y="260" width="5" height="99" rx="2" fill="#0972d3" opacity="0.9"/><text x="190" y="289" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Credentials</text><text x="190" y="308" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">console: code + PKCE</text><text x="190" y="325" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">CLI: device flow (afs sso login)</text><text x="190" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">pipelines: API keys, ≤ 90 days</text></g><g><rect x="375" y="260" width="270" height="99" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="375" y="260" width="5" height="99" rx="2" fill="#ec7211" opacity="0.9"/><text x="510" y="289" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-api</text><text x="510" y="308" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">validate JWT against JWKS</text><text x="510" y="325" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">resolve role bindings</text><text x="510" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">Authorize(principal, perm, team)</text></g><g><rect x="55" y="410" width="135" height="92" rx="10" fill="#232f3e" stroke="#232f3e" stroke-width="1.6"/><rect x="55" y="410" width="5" height="92" rx="2" fill="#232f3e" opacity="0"/><text x="122.5" y="452.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">service_admin</text><text x="122.5" y="471.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d5dbdb">everything</text></g><g><rect x="200" y="410" width="135" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="200" y="410" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="267.5" y="452.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">team_admin</text><text x="267.5" y="471.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">one team</text></g><g><rect x="345" y="410" width="135" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="345" y="410" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="412.5" y="444" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">team_viewer</text><text x="412.5" y="463" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">read only,</text><text x="412.5" y="480" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">no secret values</text></g><g><rect x="490" y="410" width="155" height="92" rx="10" fill="#fdeeec" stroke="#d13212" stroke-width="1.6"/><rect x="490" y="410" width="5" height="92" rx="2" fill="#d13212" opacity="0.9"/><text x="567.5" y="452.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6b1104">security_operator</text><text x="567.5" y="471.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">work orders only</text></g><g><rect x="735" y="150" width="280" height="65" rx="10" fill="#edf2fe" stroke="#326ce5" stroke-width="1.6"/><rect x="735" y="150" width="5" height="65" rx="2" fill="#326ce5" opacity="0.9"/><text x="875" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#102a6b">ServiceAccount agent-&lt;name&gt;</text><text x="875" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">in afs-t-&lt;team&gt;, no RBAC</text></g><g><rect x="735" y="260" width="280" height="82" rx="10" fill="#f6f0ff" stroke="#7d3cff" stroke-width="1.6"/><rect x="735" y="260" width="5" height="82" rx="2" fill="#7d3cff" opacity="0.9"/><text x="875" y="289" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3b1580">EKS Pod Identity</text><text x="875" y="308" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">session tags: namespace,</text><text x="875" y="325" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">service account, pod</text></g><g><rect x="735" y="380" width="280" height="82" rx="10" fill="#f6f0ff" stroke="#7d3cff" stroke-width="1.6"/><rect x="735" y="380" width="5" height="82" rx="2" fill="#7d3cff" opacity="0.9"/><text x="875" y="409" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3b1580">Team role afs-&lt;team id&gt;</text><text x="875" y="428" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">default: shared by the team</text><text x="875" y="445" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">ABAC on afs-team-id</text></g><g><rect x="1060" y="380" width="290" height="82" rx="10" fill="#f6f0ff" stroke="#7d3cff" stroke-width="1.6"/><rect x="1060" y="380" width="5" height="82" rx="2" fill="#7d3cff" opacity="0.9"/><text x="1205" y="409" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3b1580">Dedicated role afs-&lt;agent id&gt;</text><text x="1205" y="428" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">least privilege per agent</text><text x="1205" y="445" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">team permissions boundary</text></g><g><rect x="1060" y="520" width="290" height="82" rx="10" fill="#f6f0ff" stroke="#7d3cff" stroke-width="1.6"/><rect x="1060" y="520" width="5" height="82" rx="2" fill="#7d3cff" opacity="0.9"/><text x="1205" y="549" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3b1580">Cross-account role links</text><text x="1205" y="568" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">allowed-accounts glob filter</text><text x="1205" y="585" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">external ID; profile in /etc/afs/aws</text></g><g><rect x="1100" y="150" width="250" height="82" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="1100" y="150" width="5" height="82" rx="2" fill="#ec7211" opacity="0.9"/><text x="1225" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">Gateway identity</text><text x="1225" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">source pod IP via Cilium</text><text x="1225" y="215" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">optional projected token</text></g><g><rect x="735" y="520" width="280" height="82" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="735" y="520" width="5" height="82" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="875" y="549" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">External identities</text><text x="875" y="568" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">GitHub App, bot accounts</text><text x="875" y="585" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">credentials as team secrets</text></g><text x="55" y="395" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0972d3">ROLES, BOUND PER TEAM</text><text x="55" y="540" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">Bindings go to a user or an IdP group, per team.</text><text x="55" y="557.5" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">GET /v1/me returns effective permissions so clients can</text><text x="55" y="575" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">disable controls; the API is still the only decision point.</text><text x="55" y="592.5" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">Row-level security in PostgreSQL is the second wall.</text><text x="1376" y="686" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8d99a8">Enterprise Agent Factory Service · identity-access</text></svg>
